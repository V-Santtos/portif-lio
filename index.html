<!doctype html>
<html lang="pt-BR" data-booting>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Override temporario da primeira abertura. Se a intro ja foi vista nesta
       aba, o script sincronico abaixo remove esta tag antes da primeira
       pintura. Ao terminar a intro, o React tambem a remove e devolve ao
       Safari a amostragem natural das secoes. -->
  <meta id="opening-theme-color" name="theme-color" content="#1b1a18" />
  <link rel="icon" type="image/svg+xml" href="/LOGO.svg" />

  <!-- Google Analytics 4 — script real (172KB) só carrega depois do "load"
       (medido 2026-08-26: sozinho pesava quase tanto quanto o bundle do app
       inteiro e derrubou o Performance mobile de 93 pra 74). gtag() já
       funciona antes disso: as chamadas ficam na fila do dataLayer e são
       processadas assim que a lib real chega — não perde nenhum evento. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PWDF45HT27');
    window.addEventListener('load', function () {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PWDF45HT27';
      document.head.appendChild(s);
    });
  </script>

  <!-- Meta padrão (fallback da HOME, e o que scrapers sem JS enxergam).
       As rotas internas sobrescrevem via react-helmet-async (src/Seo.jsx).
       __SITE_URL__ é injetado no build pelo plugin em vite.config.js, a
       partir de SITE_URL em src/seo.js — não hardcodar domínio aqui de novo. -->
  <!-- data-rh="true": marca essas tags como "gerenciadas pelo Helmet". Quando o
       JS roda, o react-helmet-async as REMOVE e injeta as da rota atual (sem
       duplicar). Sem JS (scraper de WhatsApp/etc.), elas ficam como fallback da
       HOME. O <title> o Helmet já substitui pelo texto; JSON-LD ele não toca. -->
  <title>Victor Cardoso — Sites que convertem. Sistemas que escalam</title>
  <meta name="description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer. Sites e sistemas sob medida, feitos para converter." />
  <link rel="canonical" data-rh="true" href="__SITE_URL__/" />

  <!-- OpenGraph / Twitter (preview ao compartilhar o link) -->
  <meta property="og:type" data-rh="true" content="website" />
  <meta property="og:site_name" data-rh="true" content="Victor Cardoso" />
  <meta property="og:title" data-rh="true" content="Victor Cardoso — Sites que convertem. Sistemas que escalam" />
  <meta property="og:description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer. Sites e sistemas sob medida, feitos para converter." />
  <meta property="og:url" data-rh="true" content="__SITE_URL__/" />
  <meta property="og:image" data-rh="true" content="__SITE_URL__/og-image.png" />
  <meta property="og:image:width" data-rh="true" content="1200" />
  <meta property="og:image:height" data-rh="true" content="630" />
  <meta property="og:locale" data-rh="true" content="pt_BR" />
  <meta name="twitter:card" data-rh="true" content="summary_large_image" />
  <meta name="twitter:title" data-rh="true" content="Victor Cardoso — Sites que convertem. Sistemas que escalam" />
  <meta name="twitter:description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer." />
  <meta name="twitter:image" data-rh="true" content="__SITE_URL__/og-image.png" />

  <!-- Dados estruturados (schema.org Person). @id fixo: os schemas injetados
       por rota (src/seo.js, via react-helmet-async em src/Seo.jsx) referenciam
       esse nó por @id em vez de reemitir Person — evita duplicar quando o
       React monta. Não remover o @id nem mudar o sufixo "#person" sem
       atualizar PERSON_ID em src/seo.js junto. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "@id": "__SITE_URL__/#person",
    "name": "Victor Cardoso",
    "url": "__SITE_URL__",
    "image": "__SITE_URL__/og-image.png",
    "jobTitle": "Designer & Desenvolvedor",
    "description": "Criação de páginas de captura, sites e automações sob medida para negócios.",
    "sameAs": ["https://www.instagram.com/victorcard.s/"],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+5533984246770",
      "contactType": "customer service",
      "areaServed": "BR",
      "availableLanguage": "Portuguese"
    }
  }
  </script>

  <!-- Fontes self-hosted (2026-09-02). Antes: preconnect + CSS do Google
       (padrao loadCSS). O A1 da auditoria tirou o bloqueio de renderizacao,
       mas os arquivos seguiam em terceiro — googleapis pro CSS, gstatic pro
       woff2, dois DNS+TLS antes do primeiro glifo. No Ctrl+Shift+R isso virava
       FOUT visivel: sessionStorage sobrevive ao hard reload (intro pulada), o
       cache HTTP nao, e o hero pintava em Arial sem o loader cobrindo.

       Preload so nas duas que aparecem antes do reveal e que o
       InitialLoader espera (Bebas no contador, Inter no PreHero). Birthstone
       e decorativa e so aparece bem abaixo da dobra — entra pelo @font-face
       normal, sem disputar banda com o caminho critico.

       Os @font-face vivem em src/styles/01-tokens.css, junto dos tokens
       --font-display / --font-body. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/bebas-neue-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-latin.woff2" crossorigin />

  <style>
    /* Boot em CREME (não escuro): o Safari iOS amostra os pixels da primeira
       pintura pra colorir a status bar e só re-amostra em scroll — boot escuro
       deixava a tarja preta presa até o usuário interagir. Exceção: quando a
       intro one-shot VAI tocar (decidido pelo script abaixo, antes da primeira
       pintura), o boot é escuro pra casar com o loader. */
    html[data-booting], html[data-booting] body { background: #FEF8E8; }
    html[data-booting] body { overflow: hidden; }
    html[data-booting] #__boot {
      position: fixed;
      inset: 0;
      /* Mesmo wash do Hero desktop, comprimido para a viewport inteira.
         No refresh recorrente este e o primeiro frame: nada de creme chapado
         antes do React montar e fechar a geometria dos pins. */
      background:
        linear-gradient(to top,
          #f05235 0%,
          rgba(240, 82, 53, 0.86) 10.44%,
          rgba(240, 82, 53, 0.55) 22.04%,
          rgba(240, 82, 53, 0.28) 33.64%,
          rgba(240, 82, 53, 0.10) 46.4%,
          rgba(240, 82, 53, 0) 58%
        ),
        #FEF8E8;
      z-index: 99;
      pointer-events: none;
    }
    /* color-scheme acompanha o boot escuro: com a tela preta, o documento
       resolver como `dark` e o que casa com scrollbar, controles de formulario
       e canvas padrao. Fica no <style> inline porque precisa valer ja na
       primeira pintura, e pega carona no data-boot-dark — mesmo interruptor,
       nenhuma peca nova.

       🔴 O que ele NAO faz: nao governa a barra de baixo do Safari iOS.
       Testado no aparelho em 2026-09-02 com uma sonda de 4 paginas. A barra
       amostra o CONTEUDO ROLAVEL e ignora overlay position:fixed — com
       theme-color e color-scheme ambos escuros e corretos, ela AINDA nascia
       creme, porque o Hero (creme) estava embaixo do loader preto. Quem
       resolve e a classe is-opening-dark (App.jsx + src/styles/06-hero.css).
       Nao tentar consertar a barra mexendo aqui de novo: ja falhou duas
       vezes. Regra e porque completo em Regras/05. */
    html { color-scheme: light; }
    html[data-boot-dark] { color-scheme: dark; }
    html[data-boot-dark], html[data-boot-dark] body { background: #1b1a18; }
    html[data-boot-dark] #__boot { background: #1b1a18; }
    html:not([data-booting]) #__boot { display: none; }
    /* Mobile: a primeira pintura JÁ carrega o wash do Hero (creme→laranja),
       porque o Hero é client-rendered e o Safari iOS amostra os pixels do
       primeiro frame pra colorir as barras (e só re-amostra em scroll). Sem
       isso a 1a pintura é creme chapado e as barras CONGELAM creme. Com o
       laranja na base do boot, a barra inferior nasce laranja como no site de
       referencia. Nao vale pro boot escuro da intro (data-boot-dark). */
    @media (max-width: 767px) {
      html[data-booting]:not([data-boot-dark]) #__boot {
        /* Replica os pontos do wash final do Hero. Assim, a primeira pintura
           que o Safari vê não exibe um gradiente maior nem mais duro antes do
           CSS da aplicação assumir. */
        background:
          linear-gradient(to top,
            #f05235 0%,
            #f05235 11.04%,
            rgba(240, 82, 53, 0.94) 17.48%,
            rgba(240, 82, 53, 0.72) 25.76%,
            rgba(240, 82, 53, 0.44) 34.04%,
            rgba(240, 82, 53, 0.16) 40.48%,
            rgba(240, 82, 53, 0) 46%
          ),
          #FEF8E8;
      }
    }
  </style>
  <script>
    // Roda ANTES da primeira pintura. A meta nasce preta por seguranca; se a
    // intro one-shot ja foi vista nesta aba, ela e removida imediatamente e o
    // Safari volta a amostrar as cores da pagina por conta propria.
    (function () {
      try {
        if (sessionStorage.getItem("victor-initial-loader-seen-v1") !== "1") {
          document.documentElement.setAttribute("data-boot-dark", "");
        } else {
          var meta = document.getElementById("opening-theme-color");
          if (meta) meta.remove();
        }
      } catch (e) {
        // O React tambem mostra a intro quando o storage e recusado. Manter o
        // estado escuro aqui evita loader preto sobre um chrome claro.
        document.documentElement.setAttribute("data-boot-dark", "");
      }
    })();
  </script>
</head>
<body>
  <div id="__boot" aria-hidden="true"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
