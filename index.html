<!doctype html>
<html lang="pt-BR" data-booting>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="/LOGO.svg" />
  <!-- SEM meta theme-color (experimento 2026-07-08): sem a dica, o Safari iOS
       amostra as bordas da página de forma independente — topo creme e base
       laranja do degradê do Hero (mesmo comportamento do site de referência).
       Se a loteria de amostragem incomodar, restaurar:
       <meta name="theme-color" content="#FEF8E8" /> -->

  <!-- Meta padrão (fallback da HOME, e o que scrapers sem JS enxergam).
       As rotas internas sobrescrevem via react-helmet-async (src/Seo.jsx).
       Domínio atual: deploy grátis da Vercel — trocar as URLs abaixo ao
       migrar pro domínio próprio (junto de robots.txt / sitemap.xml / seo.js). -->
  <!-- data-rh="true": marca essas tags como "gerenciadas pelo Helmet". Quando o
       JS roda, o react-helmet-async as REMOVE e injeta as da rota atual (sem
       duplicar). Sem JS (scraper de WhatsApp/etc.), elas ficam como fallback da
       HOME. O <title> o Helmet já substitui pelo texto; JSON-LD ele não toca. -->
  <title>Victor Cardoso — Páginas que convertem. Sistemas que escalam.</title>
  <meta name="description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer. Sites e sistemas sob medida, feitos para converter." />
  <link rel="canonical" data-rh="true" href="https://portif-lio-three-kohl.vercel.app/" />

  <!-- OpenGraph / Twitter (preview ao compartilhar o link) -->
  <meta property="og:type" data-rh="true" content="website" />
  <meta property="og:site_name" data-rh="true" content="Victor Cardoso" />
  <meta property="og:title" data-rh="true" content="Victor Cardoso — Páginas que convertem. Sistemas que escalam." />
  <meta property="og:description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer. Sites e sistemas sob medida, feitos para converter." />
  <meta property="og:url" data-rh="true" content="https://portif-lio-three-kohl.vercel.app/" />
  <meta property="og:image" data-rh="true" content="https://portif-lio-three-kohl.vercel.app/og-image.png" />
  <meta property="og:image:width" data-rh="true" content="1200" />
  <meta property="og:image:height" data-rh="true" content="630" />
  <meta property="og:locale" data-rh="true" content="pt_BR" />
  <meta name="twitter:card" data-rh="true" content="summary_large_image" />
  <meta name="twitter:title" data-rh="true" content="Victor Cardoso — Páginas que convertem. Sistemas que escalam." />
  <meta name="twitter:description" data-rh="true" content="Páginas de captura e automações para negócios que querem crescer." />
  <meta name="twitter:image" data-rh="true" content="https://portif-lio-three-kohl.vercel.app/og-image.png" />

  <!-- Dados estruturados (schema.org Person) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Victor Cardoso",
    "url": "https://portif-lio-three-kohl.vercel.app",
    "image": "https://portif-lio-three-kohl.vercel.app/og-image.png",
    "jobTitle": "Designer & Desenvolvedor",
    "description": "Criação de páginas de captura, sites e automações sob medida para negócios.",
    "sameAs": ["https://www.instagram.com/victorr.carrdoso/"],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+5533984246770",
      "contactType": "customer service",
      "areaServed": "BR",
      "availableLanguage": "Portuguese"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preload não-bloqueante: a ordem antiga tinha um <link rel="stylesheet">
       ANTES do preload da MESMA url — nessa ordem o preload não fazia nada,
       o stylesheet já tinha bloqueado a renderização (medido: 1.490ms no
       PageSpeed). Troca pro padrão loadCSS: preload vira stylesheet só
       quando termina de baixar; <noscript> cobre quem não roda JS. -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Birthstone&family=Inter:wght@300;400;500;600;800;900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Birthstone&family=Inter:wght@300;400;500;600;800;900&display=swap" />
  </noscript>

  <style>
    /* Boot em CREME (não escuro): o Safari iOS amostra os pixels da primeira
       pintura pra colorir a status bar e só re-amostra em scroll — boot escuro
       deixava a tarja preta presa até o usuário interagir. Exceção: quando a
       intro one-shot VAI tocar (decidido pelo script abaixo, antes da primeira
       pintura), o boot é escuro pra casar com o loader. */
    html[data-booting], html[data-booting] body { background: #FEF8E8; }
    html[data-booting] body { overflow: hidden; }
    html[data-booting] #__boot {
      position: fixed;
      inset: 0;
      /* Mesmo wash do Hero desktop, comprimido para a viewport inteira.
         No refresh recorrente este e o primeiro frame: nada de creme chapado
         antes do React montar e fechar a geometria dos pins. */
      background:
        linear-gradient(to top,
          #f05235 0%,
          rgba(240, 82, 53, 0.86) 10.44%,
          rgba(240, 82, 53, 0.55) 22.04%,
          rgba(240, 82, 53, 0.28) 33.64%,
          rgba(240, 82, 53, 0.10) 46.4%,
          rgba(240, 82, 53, 0) 58%
        ),
        #FEF8E8;
      z-index: 99;
      pointer-events: none;
    }
    html[data-boot-dark], html[data-boot-dark] body { background: #1b1a18; }
    html[data-boot-dark] #__boot { background: #1b1a18; }
    html:not([data-booting]) #__boot { display: none; }
    /* Mobile: a primeira pintura JÁ carrega o wash do Hero (creme→laranja),
       porque o Hero é client-rendered e o Safari iOS amostra os pixels do
       primeiro frame pra colorir as barras (e só re-amostra em scroll). Sem
       isso a 1a pintura é creme chapado e as barras CONGELAM creme. Com o
       laranja na base do boot, a barra inferior nasce laranja como no site de
       referencia. Nao vale pro boot escuro da intro (data-boot-dark). */
    @media (max-width: 767px) {
      html[data-booting]:not([data-boot-dark]) #__boot {
        /* Replica os pontos do wash final do Hero. Assim, a primeira pintura
           que o Safari vê não exibe um gradiente maior nem mais duro antes do
           CSS da aplicação assumir. */
        background:
          linear-gradient(to top,
            #f05235 0%,
            #f05235 11.04%,
            rgba(240, 82, 53, 0.94) 17.48%,
            rgba(240, 82, 53, 0.72) 25.76%,
            rgba(240, 82, 53, 0.44) 34.04%,
            rgba(240, 82, 53, 0.16) 40.48%,
            rgba(240, 82, 53, 0) 46%
          ),
          #FEF8E8;
      }
    }
  </style>
  <script>
    // Roda ANTES da primeira pintura: se a intro one-shot ainda não foi vista
    // nesta aba, o boot (e a dica de theme-color) nascem escuros, integrados ao
    // loader. Nas cargas seguintes fica tudo creme. Decidir aqui é o único
    // jeito confiável — o Safari iOS ignora trocas tardias de theme-color.
    (function () {
      try {
        if (sessionStorage.getItem("victor-initial-loader-seen-v1") !== "1") {
          document.documentElement.setAttribute("data-boot-dark", "");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#1b1a18");
        }
      } catch (e) { /* sessionStorage bloqueado → segue creme */ }
    })();
  </script>
</head>
<body>
  <div id="__boot" aria-hidden="true"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
