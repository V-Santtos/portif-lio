<!doctype html>
<html lang="pt-BR" data-booting>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- SEM meta theme-color (experimento 2026-07-08): sem a dica, o Safari iOS
       amostra as bordas da página de forma independente — topo creme e base
       laranja do degradê do Hero (mesmo comportamento do site de referência).
       Se a loteria de amostragem incomodar, restaurar:
       <meta name="theme-color" content="#FEF8E8" /> -->

  <title>Victor Cardoso - Paginas que convertem. Sistemas que escalam.</title>
  <meta name="description" content="Paginas de captura e automacoes para negocios que querem crescer. Sistemas sob medida, entrega editorial, conversao como metrica unica." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Birthstone&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Birthstone&family=Inter:wght@400;500;600;800&display=swap" />

  <style>
    /* Boot em CREME (não escuro): o Safari iOS amostra os pixels da primeira
       pintura pra colorir a status bar e só re-amostra em scroll — boot escuro
       deixava a tarja preta presa até o usuário interagir. Exceção: quando a
       intro one-shot VAI tocar (decidido pelo script abaixo, antes da primeira
       pintura), o boot é escuro pra casar com o loader. */
    html[data-booting], html[data-booting] body { background: #FEF8E8; }
    html[data-booting] body { overflow: hidden; }
    html[data-booting] #__boot {
      position: fixed;
      inset: 0;
      background: #FEF8E8;
      z-index: 99;
      pointer-events: none;
    }
    html[data-boot-dark], html[data-boot-dark] body { background: #1b1a18; }
    html[data-boot-dark] #__boot { background: #1b1a18; }
    html:not([data-booting]) #__boot { display: none; }
  </style>
  <script>
    // Roda ANTES da primeira pintura: se a intro one-shot ainda não foi vista
    // nesta aba, o boot (e a dica de theme-color) nascem escuros, integrados ao
    // loader. Nas cargas seguintes fica tudo creme. Decidir aqui é o único
    // jeito confiável — o Safari iOS ignora trocas tardias de theme-color.
    (function () {
      try {
        if (sessionStorage.getItem("victor-initial-loader-seen-v1") !== "1") {
          document.documentElement.setAttribute("data-boot-dark", "");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#1b1a18");
        }
      } catch (e) { /* sessionStorage bloqueado → segue creme */ }
    })();
  </script>
</head>
<body>
  <div id="__boot" aria-hidden="true"></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
