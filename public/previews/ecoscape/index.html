<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Preview do hero EcoScape</title>
    <link rel="preload" href="./assets/background-aerial.webp" as="image" type="image/webp" />
    <link rel="preload" href="./assets/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <main class="capsule" aria-label="Preview do hero do site EcoScape">
      <img class="capsule__background" src="./assets/background-aerial.webp" alt="" />
      <div class="capsule__shade" aria-hidden="true"></div>

      <header class="capsule__header">
        <img class="capsule__logo" src="./assets/logo.svg" alt="EcoScape" />

        <nav class="capsule__nav" aria-label="Navegação do preview">
          <button class="nav-roll" type="button">
            <span class="nav-roll__track">
              <span>Início</span><span aria-hidden="true">Início</span>
            </span>
          </button>
          <button class="nav-roll" type="button">
            <span class="nav-roll__track">
              <span>Sobre Nós</span><span aria-hidden="true">Sobre Nós</span>
            </span>
          </button>
          <button class="nav-roll" type="button">
            <span class="nav-roll__track">
              <span>Serviços</span><span aria-hidden="true">Serviços</span>
            </span>
          </button>
          <button class="nav-roll" type="button">
            <span class="nav-roll__track">
              <span>Blog</span><span aria-hidden="true">Blog</span>
            </span>
          </button>
          <div class="nav-pages">
            <button class="nav-pages__trigger" type="button" aria-haspopup="menu">
              <span>Páginas</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M 16 0 L 8 8 L 0 0" transform="translate(4 8)" />
              </svg>
            </button>
            <div class="nav-pages__menu" role="menu" aria-label="Páginas">
              <div class="nav-pages__column">
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Preços</span><span aria-hidden="true">Preços</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Estudo de Caso</span><span aria-hidden="true">Estudo de Caso</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Detalhes do Estudo</span><span aria-hidden="true">Detalhes do Estudo</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Detalhes do Serviço</span><span aria-hidden="true">Detalhes do Serviço</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Contato</span><span aria-hidden="true">Contato</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>404</span><span aria-hidden="true">404</span></span></button>
              </div>
              <div class="nav-pages__column">
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Blogs</span><span aria-hidden="true">Blogs</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Detalhes do Blog</span><span aria-hidden="true">Detalhes do Blog</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Projetos</span><span aria-hidden="true">Projetos</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Detalhes do Projeto</span><span aria-hidden="true">Detalhes do Projeto</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Loja</span><span aria-hidden="true">Loja</span></span></button>
                <button class="nav-roll nav-pages__item" type="button" role="menuitem"><span class="nav-roll__track"><span>Detalhes da Loja</span><span aria-hidden="true">Detalhes da Loja</span></span></button>
              </div>
            </div>
          </div>
        </nav>

        <div class="capsule__header-cta" aria-label="Chamada para ação do preview">
          <button class="capsule-action" type="button" aria-label="Começar">
            <span class="capsule-action__label">
              <span class="capsule-action__label-track">
                <span>Começar</span><span aria-hidden="true">Começar</span>
              </span>
            </span>
            <span class="capsule-action__icon" aria-hidden="true">
              <svg class="capsule-action__arrow capsule-action__arrow--out" viewBox="0 0 24 24"><path d="M 13 0 L 0 13 M 13 0 L 3 0 M 13 0 L 13 10" transform="translate(5.5 5.5)" /></svg>
              <svg class="capsule-action__arrow capsule-action__arrow--in" viewBox="0 0 24 24"><path d="M 13 0 L 0 13 M 13 0 L 3 0 M 13 0 L 13 10" transform="translate(5.5 5.5)" /></svg>
            </span>
          </button>
        </div>
      </header>

      <section class="capsule__copy">
        <p class="capsule__eyebrow">// Manutenção de Gramado</p>
        <h1>
          <span>Gramas saudáveis</span>
          <span>Em <em>todas</em> as estações</span>
        </h1>
        <p class="capsule__description">
          <span>Nossos cuidados especializados e manutenção personalizada</span>
          <span>garantem que seu gramado permaneça viçoso, verde e saudável,</span>
          <span>independentemente do clima.</span>
        </p>
      </section>

      <div class="capsule__book" aria-label="Agendamento do preview">
        <button class="capsule-action" type="button" aria-label="Agendar agora">
          <span class="capsule-action__label">
            <span class="capsule-action__label-track">
              <span>Agendar Agora</span><span aria-hidden="true">Agendar Agora</span>
            </span>
          </span>
          <span class="capsule-action__icon" aria-hidden="true">
            <svg class="capsule-action__arrow capsule-action__arrow--out" viewBox="0 0 24 24"><path d="M 13 0 L 0 13 M 13 0 L 3 0 M 13 0 L 13 10" transform="translate(5.5 5.5)" /></svg>
            <svg class="capsule-action__arrow capsule-action__arrow--in" viewBox="0 0 24 24"><path d="M 13 0 L 0 13 M 13 0 L 3 0 M 13 0 L 13 10" transform="translate(5.5 5.5)" /></svg>
          </span>
        </button>
      </div>

      <aside class="capsule__stat" aria-label="Sete milhões de usuários ativos">
        <div class="capsule__stat-copy">
          <strong>7M+</strong>
          <span>Usuários ativos</span>
          <div class="capsule__avatars" aria-hidden="true">
            <img src="./assets/avatar-01.png" alt="" />
            <img src="./assets/avatar-02.png" alt="" />
            <img src="./assets/avatar-03.png" alt="" />
          </div>
        </div>
        <img class="capsule__worker" src="./assets/worker.png" alt="" />
      </aside>
    </main>
    <script src="../_shared/gsap.min.js"></script>
    <script src="./capsule.js"></script>
  </body>
</html>
