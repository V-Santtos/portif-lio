<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Preview do hero Fervor</title>
    <link rel="preload" href="./assets/sora-hero-pizza.jpg" as="image" type="image/jpeg" />
    <link rel="preload" href="./assets/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <main class="capsule" aria-label="Preview do hero da pizzaria Fervor">
      <section class="dinevo-hero">
        <nav class="dinevo-nav" aria-label="Navegação visual do preview">
          <button class="dinevo-brand" type="button" data-nav-home aria-label="Selecionar Início">
            <span>Fervor</span>
          </button>

          <div class="dinevo-nav__links">
            <button class="dinevo-nav__link is-active" type="button" aria-pressed="true">
              Início<span class="dinevo-nav__indicator" aria-hidden="true"></span>
            </button>
            <button class="dinevo-nav__link" type="button" aria-pressed="false">
              Sobre<span class="dinevo-nav__indicator" aria-hidden="true"></span>
            </button>
            <button class="dinevo-nav__link" type="button" aria-pressed="false">
              Menu<span class="dinevo-nav__indicator" aria-hidden="true"></span>
            </button>
            <button class="dinevo-nav__link" type="button" aria-pressed="false">
              Páginas<span class="dinevo-nav__indicator" aria-hidden="true"></span>
            </button>
            <button class="dinevo-nav__link" type="button" aria-pressed="false">
              Contato<span class="dinevo-nav__indicator" aria-hidden="true"></span>
            </button>
          </div>

          <button class="dinevo-nav__cta" type="button">
            <span class="dinevo-nav__cta-label">Reservar mesa</span>
            <svg class="dinevo-nav__arrow" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
              <path d="M5 13 13 5" />
              <path d="M7 5h6v6" />
            </svg>
          </button>
        </nav>

        <div class="dinevo-hero__media" aria-hidden="true">
          <img src="./assets/sora-hero-pizza.jpg" alt="" />
          <div class="dinevo-hero__shade"></div>
        </div>

        <div class="dinevo-hero__content">
          <p class="dinevo-hero__eyebrow">Do forno para a mesa,</p>

          <div class="dinevo-hero__title" role="heading" aria-level="2">
            <span>Onde a elegância</span>
            <span>encontra sabor</span>
          </div>

          <div class="dinevo-hero__support">
            <p>
              Transformamos cada refeição em uma experiência memorável.<br />
              Pratos marcantes preparados a cada serviço.
            </p>
          </div>

          <div class="dinevo-hero__actions">
            <button class="dinevo-hero__primary" type="button">
              Explorar menu
              <svg class="dinevo-hero__primary-arrow" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M3.5 16.5 16.5 3.5" />
                <path d="M8 3.5h8.5V12" />
              </svg>
            </button>
          </div>
        </div>

        <aside class="dinevo-signature-card" aria-label="Prato em destaque">
          <header>
            <strong>Conheça nossos pratos autorais</strong>
            <svg class="dinevo-signature-card__arrow" viewBox="0 0 20 15" aria-hidden="true" focusable="false">
              <path d="M17.434 8.477 13.516 12.396 9.597 8.477" />
              <path d="M13.511 12.392V5.677A4.477 4.477 0 0 0 9.034 1.2H1.2" />
            </svg>
          </header>
          <div class="dinevo-signature-card__media" aria-hidden="true">
            <img class="dinevo-signature-card__dish" src="./assets/signature-pizza-classic.webp" alt="" width="768" height="492" decoding="async" />
            <img class="dinevo-signature-card__dish" src="./assets/signature-salmon-bowl.webp" alt="" width="768" height="492" decoding="async" />
            <img class="dinevo-signature-card__dish" src="./assets/signature-pizza-special.webp" alt="" width="768" height="492" decoding="async" />
          </div>
        </aside>
      </section>
    </main>

    <script src="../_shared/gsap.min.js"></script>
    <script src="./capsule.js"></script>
  </body>
</html>
