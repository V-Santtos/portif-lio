<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Preview do hero Minas Tintas</title>
    <link rel="preload" href="./assets/hero-swatches.webp" as="image" type="image/webp" />
    <link rel="preload" href="./assets/anton.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <main class="capsule" aria-label="Preview do hero do site Minas Tintas">
      <!-- Navbar: no site é irmã da section, absoluta sobre o painel creme -->
      <nav class="capsule__nav" aria-label="Navegação do preview">
        <ul class="nav-list">
          <li class="nav-item" data-id="inicio"><button type="button">Início</button></li>
          <li class="nav-item" data-id="tintas"><button type="button">Tintas</button></li>
          <li class="nav-item" data-id="texturas"><button type="button">Texturas</button></li>
          <li class="nav-item" data-id="sobre"><button type="button">Sobre</button></li>
          <li class="nav-item" data-id="contato"><button type="button">Contato</button></li>
          <span class="nav-indicator" aria-hidden="true"></span>
        </ul>
      </nav>

      <!-- Painel esquerdo: creme, 60% -->
      <div class="capsule__left">
        <div class="capsule__top">
          <header class="capsule__logo">
            <img src="./assets/logo.webp" alt="Minas Tintas" />
          </header>

          <h1 class="capsule__title">
            Tudo começa<br />com a <span class="capsule__accent">cor</span> certa.
          </h1>

          <div class="capsule__rule" aria-hidden="true"></div>

          <p class="capsule__subtitle">
            Linha completa em tintas imobiliárias,<br />
            automotivas, ferramentas e muito mais.<br />
            Tudo que sua obra merece, em um só lugar.
          </p>
        </div>

        <footer class="capsule__footer">
          <div class="capsule__contacts">
            <button class="contact" type="button">
              <span class="contact__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="5" ry="5" />
                  <circle cx="12" cy="12" r="4" />
                  <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
                </svg>
              </span>
              <span>@minastintas</span>
            </button>

            <button class="contact" type="button">
              <span class="contact__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
                  <path d="M17.5 14.4c-.3-.1-1.8-.9-2-1s-.5-.1-.7.2-.8 1-1 1.2c-.2.2-.4.2-.7.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.4.5-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.7-1.7-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4s-1 1-1 2.5 1 2.9 1.2 3.1c.1.2 2 3.2 5 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.3-.7.3-1.3.2-1.4s-.3-.2-.6-.3z" />
                  <path d="M20.5 3.5C18.3 1.2 15.3 0 12 0 5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6c1.7.9 3.7 1.4 5.7 1.4h.1c6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.3zM12 21.9c-1.8 0-3.6-.5-5.1-1.4l-.4-.2-3.7 1 1-3.6-.2-.4c-1-1.6-1.6-3.4-1.6-5.3C2 6.6 6.5 2.1 12 2.1S22 6.6 22 12c0 5.4-4.5 9.9-10 9.9z" />
                </svg>
              </span>
              <span>(33) 9972-0025</span>
            </button>

            <div class="contact contact--static">
              <span class="contact__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
              </span>
              <span>Simonésia, MG</span>
            </div>
          </div>
        </footer>
      </div>

      <!-- Painel direito: 3 listras diagonais + foto, todas no mesmo clip-path -->
      <div class="capsule__media">
        <div class="wipe wipe--black" aria-hidden="true"></div>
        <div class="wipe wipe--red" aria-hidden="true"></div>
        <div class="wipe wipe--cream" aria-hidden="true"></div>
        <div class="wipe wipe--photo">
          <img src="./assets/hero-swatches.webp" alt="" />
        </div>
      </div>
    </main>

    <script src="../_shared/gsap.min.js"></script>
    <script src="./capsule.js"></script>
    <script src="../_shared/preview-ready.js"></script>
  </body>
</html>
