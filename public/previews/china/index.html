<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Preview do hero Restaurante China</title>
    <link rel="preload" href="./assets/hero-poster.webp" as="image" type="image/webp" />
    <link rel="preload" href="./assets/china-navbar.svg" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="./capsule.css" />
  </head>
  <body>
    <main class="capsule" aria-label="Preview do site do Restaurante China">
      <section class="capsule__hero">
        <video
          class="capsule__hero-media"
          src="./assets/hero.mp4"
          poster="./assets/hero-poster.webp"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          aria-hidden="true"
        ></video>
        <div class="capsule__hero-shade" aria-hidden="true"></div>

        <header class="capsule__header">
          <button class="capsule__menu" type="button" aria-label="Abrir menu">
            <span></span><span></span><span></span>
          </button>
          <button class="capsule__brand" type="button" aria-label="Restaurante China">
            <img src="./assets/china-navbar.svg" alt="" width="280" height="100" />
          </button>
          <nav class="capsule__nav" aria-label="Navegação do preview">
            <button type="button">Cardápio</button>
            <button type="button">Sobre</button>
          </nav>
          <button class="capsule__reserve" type="button">Reservar mesa</button>
        </header>

        <div class="capsule__socials" aria-label="Redes sociais">
          <button type="button" aria-label="WhatsApp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.87 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35ZM12.05 21.79a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.38a9.86 9.86 0 0 1-1.51-5.26A9.9 9.9 0 0 1 12.07 2c2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 7 9.9 9.9 0 0 1-9.9 9.89Z" /></svg>
          </button>
          <button type="button" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.25"/><circle class="is-filled" cx="17.35" cy="6.75" r="1.1"/></svg>
          </button>
        </div>
      </section>

      <aside class="capsule__cards" aria-label="Atalhos do Restaurante China">
        <button class="capsule__card" type="button">
          <img src="./assets/menu.webp" alt="Cardápio" width="1200" height="830" />
          <span class="capsule__card-shade" aria-hidden="true"></span>
          <span class="capsule__card-label">Cardápio <i aria-hidden="true">→</i></span>
        </button>
        <button class="capsule__card" type="button">
          <img src="./assets/reservation.webp" alt="Reservas" width="1200" height="1600" />
          <span class="capsule__card-shade" aria-hidden="true"></span>
          <span class="capsule__card-label">Reservas <i aria-hidden="true">→</i></span>
        </button>
        <button class="capsule__card" type="button">
          <img src="./assets/restaurant.webp" alt="Nosso restaurante" width="1600" height="1200" />
          <span class="capsule__card-shade" aria-hidden="true"></span>
          <span class="capsule__card-label">Nosso restaurante <i aria-hidden="true">→</i></span>
        </button>
      </aside>
    </main>

    <script src="./capsule.js"></script>
    <script src="../_shared/preview-ready.js"></script>
  </body>
</html>
