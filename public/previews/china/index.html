          evento.stopImmediatePropagation();
          ultimoAcionador = evento.currentTarget;
        }
        overlay.hidden = false;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { overlay.classList.add("china-menu-aberto"); });
        });
        document.body.style.overflow = "hidden";
        definirExpandido(true);
        var primeiroLink = overlay.querySelector("a");
        if (primeiroLink) primeiroLink.focus();
      }
      function fecharMenu() {
        overlay.classList.remove("china-menu-aberto");
        document.body.style.overflow = "";
        definirExpandido(false);
        if (ultimoAcionador) ultimoAcionador.focus();
        setTimeout(function () { overlay.hidden = true; }, 280);
      }
      for (var k = 0; k < acionadores.length; k++) {
        acionadores[k].setAttribute("role", "button");
        acionadores[k].setAttribute("aria-label", "Abrir menu");
        acionadores[k].setAttribute("aria-controls", "china-menu-interno");
        acionadores[k].setAttribute("aria-expanded", "false");
        acionadores[k].addEventListener("click", abrir, true);
        acionadores[k].addEventListener("keydown", function (evento) {
          if (evento.key === "Enter" || evento.key === " ") abrir(evento);
        }, true);
      }
      fechar.addEventListener("click", fecharMenu);
      document.addEventListener("keydown", function (evento) {
        if (evento.key === "Escape" && !overlay.hidden) fecharMenu();
      });
    })();
  </script>

  <script id="china-topo-no-refresh">
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";
    window.scrollTo(0, 0);
    window.addEventListener("pageshow", function () { window.scrollTo(0, 0); });
  </script>
